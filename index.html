<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thibault Passini Portfolio 2026</title>
<link rel="icon" href="mid/m00.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one screen. The landing is two columns only, "If you have time" over the
     brushed-steel book and "If not" over the six project cards. Reading mode adds a glass bar and dock. */
  --bg:#ACAFAA;
  --bg-hi:#C5C8C3;
  --bg-lo:#8F928D;
  --ink:#131414;
  --ink-2:rgba(19,20,20,.66);
  --hair:rgba(19,20,20,.14);
  --blue:#2B5BFF;
  --glass:rgba(208,211,206,.62);
  --paper:#F4F1EA;
  --cond:"Archivo","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --display:"Playfair Display","Didot","Bodoni MT",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Archivo,Arial,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.2,1);
  --bar:52px;
  --pw:400px; --ph:427px; --o:6px; --persp:2000px; --tl:0; --tr:1;
  --lx:.5; --ly:.4;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; color:var(--ink); font-family:var(--ui);
  background:
    url(fx/grain.webp) 0 0/128px 128px,
    radial-gradient(110% 85% at 50% 42%, var(--bg-hi) 0%, var(--bg) 52%, var(--bg-lo) 100%);
  background-blend-mode:overlay, normal;
  background-attachment:fixed, fixed;
  background-color:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:199;
  background:radial-gradient(130% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(20,20,20,.28) 100%)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:6px}
img{max-width:100%}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}

/* ───────── close (reading only) ───────── */
.topright{position:fixed; z-index:30; top:clamp(10px,2.2vh,20px); right:clamp(18px,3vw,44px); display:flex; align-items:center; gap:clamp(14px,1.6vw,22px);
  transition:opacity .5s, transform .7s var(--ease)}
body:not(.reading) .topright{opacity:0; transform:translateY(-8px); pointer-events:none}
.fsbtn{width:36px; height:36px; display:grid; place-items:center; color:var(--ink); opacity:.75; transition:opacity .2s, transform .35s var(--ease)}
.fsbtn:hover{opacity:1; transform:scale(1.08)}
.fsbtn svg{width:17px; height:17px}
.fsbtn .out{display:none}
.is-fs .fsbtn .in{display:none} .is-fs .fsbtn .out{display:block}
.closebook{padding:8px 2px;
  font-family:var(--display); font-size:18px; font-weight:400; letter-spacing:.005em; color:var(--ink);
  background:none; border-radius:0; }
.closebook::after{content:""; display:block; height:1px; margin-top:3px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .45s var(--ease)}
.closebook:hover::after,.closebook:focus-visible::after{transform:scaleX(1); transform-origin:left}
.icon{width:36px; height:36px; display:grid; place-items:center; border-radius:50%; color:var(--ink-2); transition:background .2s,color .2s}
.icon:hover{background:rgba(19,20,20,.08); color:var(--ink)}
.icon svg{width:17px; height:17px}

/* ───────── landing ───────── */
#app{position:fixed; z-index:1; inset:0}
.home{
  position:absolute; inset:0; z-index:1;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"h1 h2" "book cards";
  column-gap:clamp(28px,5vw,96px); row-gap:clamp(14px,3vh,34px);
  padding:clamp(28px,7vh,72px) clamp(24px,5.5vw,96px) clamp(26px,6vh,64px);
  transition:opacity .55s var(--ease), visibility .55s;
}
.is-reading .home{opacity:0; visibility:hidden; pointer-events:none}
.hd{min-width:0}
.hd.a{grid-area:h1} .hd.b{grid-area:h2}
.hd h2{
  margin:0; font-family:var(--cond); font-weight:760; font-stretch:68%; text-transform:uppercase;
  font-size:clamp(40px, min(5.4vw, 10.5vh), 118px); line-height:.86; letter-spacing:-.006em; text-wrap:balance;
}
.sub{display:inline-flex; align-items:center; gap:10px; margin-top:clamp(10px,1.6vh,16px); min-height:28px;
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
button.sub{transition:color .2s}
button.sub:hover{color:var(--ink)}
button.sub svg{width:13px; height:13px; transition:transform .35s var(--ease)}
button.sub:hover svg{transform:translateX(4px)}
.slot{grid-area:book; position:relative; min-height:0; pointer-events:none}
.home-right{grid-area:cards; min-height:0; min-width:0; display:flex; align-items:center; justify-content:flex-start}

/* ───────── cards ───────── */
.cards{--cw:150px; display:grid; grid-template-columns:repeat(var(--cols,3), var(--cw)); gap:var(--gap,16px)}
.card{
  position:relative; display:block; width:var(--cw); aspect-ratio:845/1484; background:var(--paper);
  border-radius:3px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(19,20,20,.08), 0 1px 2px rgba(20,24,20,.12), 0 20px 36px -18px rgba(20,26,20,.5);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease), opacity .35s;
}
.card img{display:block; width:100%; height:100%; object-fit:cover; pointer-events:none}
.card::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,.3), rgba(255,255,255,0) 34%); opacity:0; transition:opacity .4s}
.card:hover,.card:focus-visible{transform:translateY(-10px) scale(1.035); z-index:2;
  box-shadow:0 0 0 1px rgba(19,20,20,.08), 0 2px 4px rgba(20,24,20,.1), 0 36px 54px -22px rgba(20,26,20,.6)}
.card:hover::after{opacity:1}
.card:active{transform:translateY(-6px) scale(1.01)}
.cards:hover .card:not(:hover){opacity:.7}
.card.current{box-shadow:0 0 0 2px var(--blue), 0 20px 36px -18px rgba(20,26,20,.5)}

/* ───────── stage / book ───────── */
.stage{position:absolute; inset:0; z-index:2; pointer-events:none; perspective:2600px; perspective-origin:50% 44%}
.floor{position:absolute; left:0; top:0; pointer-events:none; border-radius:50%;
  background:radial-gradient(closest-side, rgba(16,22,16,.5), rgba(16,22,16,.16) 60%, rgba(16,22,16,0)); filter:blur(8px); transition:opacity .5s}
.is-reading .floor{opacity:0}
.rig{position:absolute; left:0; top:0; width:calc(var(--pw)*2); height:var(--ph); transform-style:preserve-3d}
.book{position:absolute; inset:0; visibility:hidden}
.book-on .book{visibility:visible}
.book-on .solid{display:none}

.board{position:absolute; top:calc(var(--o)*-1); bottom:calc(var(--o)*-1); width:calc(var(--pw) + var(--o)); opacity:0;
  background:linear-gradient(180deg,#5e5d5b,#3b3a39 40%,#4f4e4c 70%,#2f2e2d);
  box-shadow:0 2px 3px rgba(10,14,10,.3), 0 30px 56px -22px rgba(10,14,10,.55), 0 60px 90px -50px rgba(10,14,10,.5)}
.board::after{content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.22)}
.board.left{left:calc(var(--o)*-1); border-radius:3px 0 0 3px}
.board.right{left:var(--pw); border-radius:0 3px 3px 0}
.has-left .board.left,.has-right .board.right{opacity:1}
.stack{position:absolute; top:1px; bottom:1px; opacity:0; transition:width .7s var(--ease)}
.stack.left{right:100%; width:calc(var(--o)*.78*var(--tl)); background:repeating-linear-gradient(to right,#d8d3c9 0,#d8d3c9 .8px,#f6f3ec .8px,#f6f3ec 1.7px)}
.stack.right{left:100%; width:calc(var(--o)*.78*var(--tr)); background:repeating-linear-gradient(to left,#d8d3c9 0,#d8d3c9 .8px,#f6f3ec .8px,#f6f3ec 1.7px)}
.has-left .stack.left,.has-right .stack.right{opacity:1}

.page{position:absolute; top:0; width:var(--pw); height:var(--ph); background:var(--paper); overflow:hidden; z-index:2}
.page.left{left:0} .page.right{left:var(--pw)}
.page img{display:block; width:100%; height:100%; -webkit-user-drag:none; user-select:none}
/* paper: fibres, tooth and a soft falloff toward the edges */
.page::before{content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:url(fx/paper.webp) 0 0/512px 512px; mix-blend-mode:multiply; opacity:.48}
.page::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  box-shadow:inset 0 0 calc(var(--pw)*.07) rgba(70,60,45,.13)}
.page.left::after{background:linear-gradient(to left, rgba(255,255,255,.07), rgba(255,255,255,0) 18%)}
.page.right::after{background:linear-gradient(to right, rgba(255,255,255,.07), rgba(255,255,255,0) 18%)}
.page.cover{top:calc(var(--o)*-1); width:calc(var(--pw) + var(--o)); height:calc(var(--ph) + var(--o)*2); background:#6e6c69}
.page.cover.right{border-radius:0 3px 3px 0; box-shadow:0 30px 56px -22px rgba(10,14,10,.55), 0 60px 90px -50px rgba(10,14,10,.5)}
.page.cover.left{left:calc(var(--o)*-1); border-radius:3px 0 0 3px; box-shadow:0 30px 56px -22px rgba(10,14,10,.55), 0 60px 90px -50px rgba(10,14,10,.5)}
.page.mcover::before,.page.mcover::after{display:none}
.gutter{position:absolute; top:0; height:100%; left:calc(var(--pw)*.94); width:calc(var(--pw)*.12); z-index:3; pointer-events:none; opacity:0;
  background:linear-gradient(to right, rgba(20,16,12,0), rgba(20,16,12,.05) 30%, rgba(20,16,12,.16) 50%, rgba(20,16,12,.05) 70%, rgba(20,16,12,0))}
.has-left.has-right .gutter{opacity:1}
.board,.stack{z-index:0}
.leaves{position:absolute; inset:0; z-index:5; pointer-events:none}
.hit{position:absolute; top:0; height:100%; width:50%; z-index:6; pointer-events:none; touch-action:none; cursor:grab}
.book-on .hit{pointer-events:auto}
.hit.prev{left:0} .hit.next{left:50%}
.dragging .hit{cursor:grabbing}
.hit:focus,.hit:focus-visible{outline:none}

/* ───────── metal cover ───────── */
.metal{position:absolute; inset:0; overflow:hidden; container-type:size; border-radius:inherit;
  background:#77746f url(fx/cover.webp) center/100% 100% no-repeat;
  --s:calc(var(--lx)*120% - 10% + var(--tilt,0)*1%);
  --gy:calc(var(--ly)*100%)}
.metal>i{position:absolute; inset:-1px; pointer-events:none}
.metal .sp1{mix-blend-mode:overlay;
  background:linear-gradient(104deg, rgba(0,0,0,.42) calc(var(--s) - 62%), rgba(0,0,0,0) calc(var(--s) - 30%), rgba(255,255,255,.9) var(--s), rgba(255,255,255,0) calc(var(--s) + 24%), rgba(0,0,0,.3) calc(var(--s) + 64%))}
.metal .sp2{mix-blend-mode:screen; opacity:.7;
  background:linear-gradient(104deg, rgba(255,255,255,0) calc(var(--s) - 10%), rgba(255,255,255,.6) var(--s), rgba(255,255,255,0) calc(var(--s) + 10%));
  -webkit-mask:url(fx/brush.webp) 0 0/100% 34%; mask:url(fx/brush.webp) 0 0/100% 34%}
.metal .sp3{mix-blend-mode:soft-light;
  background:radial-gradient(ellipse 65% 48% at calc(var(--lx)*100%) var(--gy), rgba(255,255,255,.75), rgba(255,255,255,0) 72%)}
/* Safari: background-clip:text and filter must sit on different elements, or the text vanishes */
.metal .red{position:absolute; inset:0;
  filter:drop-shadow(calc((var(--lx) - .5)*.12cqh) -0.11cqh 0 rgba(0,0,0,.78)) drop-shadow(0 0.12cqh 0 rgba(255,255,255,.55))}
.metal .red>div{color:#6a1020; -webkit-text-fill-color:transparent; color:transparent;
  background:
    linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.08) 32%, rgba(0,0,0,0) 60%, rgba(255,255,255,.12)),
    linear-gradient(104deg, #3a060e 0%, #620e1c calc(var(--s) - 34%), #a8303f var(--s), #620e1c calc(var(--s) + 34%), #34050c 100%);
  background-size:100cqw 100cqh; background-repeat:no-repeat;
  -webkit-background-clip:text; background-clip:text}
.metal .red>.ttl{background-position:-5.2cqw -17.2cqh}
.metal .red>.nm{background-position:-5.2cqw -89cqh}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .metal .red>div{color:#6a1020; -webkit-text-fill-color:#6a1020; background:none}}
.metal .ttl{position:absolute; left:5.2%; right:0; top:17.2%; text-align:center;
  font:760 9.3cqh/.968 var(--cond); font-stretch:68%; letter-spacing:-.004em; white-space:nowrap}
.metal .blk{display:inline-block; text-align:left}
.metal .blk>span{display:block}
.metal .wrk{display:flex !important; justify-content:space-between}
.metal .nm{position:absolute; left:5.2%; right:0; top:89%; text-align:center;
  font:820 2.55cqh/1 var(--cond); font-stretch:125%; letter-spacing:.01em; white-space:nowrap}
.metal .lt{position:absolute; color:rgba(214,212,208,.7); line-height:1;
  filter:drop-shadow(0 -0.07cqh 0 rgba(0,0,0,.7)) drop-shadow(0 0.08cqh 0 rgba(255,255,255,.45))}
.metal .arc{left:52.6%; top:42.8%; transform:translateX(-50%); font:400 1.25cqh var(--mono); letter-spacing:.12em; white-space:nowrap}
.metal .cat{left:0; right:0; top:78.9%; height:2.3cqh; font:300 1.9cqh/1 var(--cond); font-stretch:100%; letter-spacing:.01em}
.metal .cat>*{position:absolute; top:.2cqh; white-space:nowrap}
.metal .cat .c1{left:15.8%} .metal .cat .c2{left:52.6%; transform:translateX(-50%)} .metal .cat .c3{right:10.6%}
.metal .cat b{top:0; width:max(1px,.12cqh); height:2.3cqh; background:currentColor}
.metal .cat .p1{left:33.3%} .metal .cat .p2{left:71.8%}

/* flying leaves */
.leaf{position:absolute; left:var(--pw); top:0; width:var(--pw); height:var(--ph); perspective:var(--persp); perspective-origin:0 50%}
.leaf.hard{top:calc(var(--o)*-1); width:calc(var(--pw) + var(--o)); height:calc(var(--ph) + var(--o)*2)}
.strip{position:absolute; left:0; top:0; height:100%; transform-origin:0 50%; will-change:transform; outline:1px solid transparent}
.strip>div{position:absolute; inset:0}
.strip>.f,.strip>.b{background-color:var(--paper); background-repeat:no-repeat}
.strip>.b{transform:scaleX(-1); display:none}
.strip.back>.b{display:block} .strip.back>.f{display:none}
.strip>.pp{background:url(fx/paper.webp) 0 0/512px 512px; mix-blend-mode:multiply; opacity:.48; pointer-events:none}
.strip>.sd{background:#0d0907; opacity:0}
.strip>.cr{right:auto; width:48%; background:linear-gradient(to right, rgba(20,16,12,.15), rgba(20,16,12,.045) 40%, rgba(20,16,12,0))}
.leaf.hard .f,.leaf.hard .b{background:linear-gradient(180deg,#5e5d5b,#3b3a39 40%,#4f4e4c 70%,#2f2e2d); border-radius:0 3px 3px 0; overflow:hidden}
.leaf.hard .inset{position:absolute; width:var(--pw); height:var(--ph); top:var(--o); background-size:100% 100%; background-color:var(--paper)}
.leaf .thick{position:absolute; top:0; height:100%; background:linear-gradient(to right,#3c3b3a,#a7a39d 45%,#e2ded8 55%,#6b6966); transform-origin:50% 50%}
.cast{position:absolute; left:0; top:1.5%; width:100%; height:97%; transform-origin:0 50%; opacity:0;
  background:linear-gradient(to right, rgba(10,12,10,0) 0, rgba(10,12,10,.34) 55%, rgba(10,12,10,.6) 88%, rgba(10,12,10,0) 100%)}

/* soft pages: diagonal fold */
.fold{position:absolute; top:0; width:var(--pw); height:var(--ph); pointer-events:none}
.fold.bw{transform:scaleX(-1)}
.fold .ff,.fold .fs,.fold .fbw,.fold .fb{position:absolute; inset:0}
.fold .ff,.fold .fs,.fold .fb{overflow:hidden}
.fold .fbw{transform-origin:0 0; filter:drop-shadow(0 0 calc(var(--pw)*.022) rgba(10,8,6,.32))}
.fi{position:absolute; inset:0; background-size:100% 100%; background-color:var(--paper)}
.fi.mir{transform:scaleX(-1)}
.fi .pp{position:absolute; inset:0; background:url(fx/paper.webp) 0 0/512px 512px; mix-blend-mode:multiply; opacity:.48}
.fold .g{position:absolute; left:0; top:0; transform-origin:0 0; pointer-events:none}
.fold .fs .g{background:linear-gradient(to right, rgba(14,10,6,.46), rgba(14,10,6,.14) 38%, rgba(14,10,6,0))}
.fold .fb .g{background:linear-gradient(to right, rgba(0,0,0,.24) 0, rgba(255,255,255,.16) 12%, rgba(255,255,255,0) 30%, rgba(0,0,0,.07) 70%, rgba(0,0,0,0))}

/* closed 3D book */
.solid{position:absolute; transform-style:preserve-3d; cursor:pointer; pointer-events:auto; border-radius:2px}
.solid:focus-visible{outline:none}
.solid:focus-visible .coverface{box-shadow:0 0 0 3px var(--blue)}
.face{position:absolute; left:0; top:0; transform-origin:0 0; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.lid{position:absolute; left:0; top:0; transform-style:preserve-3d; transform-origin:0 50%; transition:transform .7s var(--ease)}
.is-home .solid:hover .lid,.is-home .solid:focus-visible .lid{transform:rotateY(-11deg)}
.face.mt.top{background:linear-gradient(to right,#d9d5cf,#a29e98 60%,#c2beb8)}
.face.mt.right{background:linear-gradient(to right,#8f8b86,#cfcbc5 40%,#6a6763)}
.face.mt-in{background:linear-gradient(180deg,#5e5d5b,#3b3a39 40%,#4f4e4c 70%,#2f2e2d)}
.face.spine,.face.lidleft{background:linear-gradient(to right,#242322,#6f6c68 22%,#d4d0ca 48%,#8c8984 70%,#2c2b2a)}
.face.spine{display:flex; align-items:center; justify-content:center}
.face.spine span{writing-mode:vertical-rl; font-family:var(--cond); font-weight:760; font-stretch:80%; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;
  color:#5a0c18; filter:drop-shadow(-1px 0 0 rgba(0,0,0,.6)) drop-shadow(1px 0 0 rgba(255,255,255,.4))}
.face.edge.top{background:repeating-linear-gradient(to bottom,#d9d4ca 0,#d9d4ca .9px,#f7f4ed .9px,#f7f4ed 2px)}
.face.edge.right{background:repeating-linear-gradient(to right,#cfc9be 0,#cfc9be .9px,#efebe3 .9px,#efebe3 2px)}
.face.blockfront{background:var(--paper) right center/cover no-repeat}
.face.coverface{border-radius:0 3px 3px 0; overflow:hidden}

/* arrows */
.arrow{position:absolute; z-index:8; width:48px; height:48px; margin-top:-24px; border-radius:50%; display:grid; place-items:center; pointer-events:auto;
  background:var(--glass); -webkit-backdrop-filter:saturate(170%) blur(18px); backdrop-filter:saturate(170%) blur(18px);
  box-shadow:0 0 0 1px var(--hair), 0 10px 24px -12px rgba(10,14,10,.45);
  transition:opacity .4s, transform .35s var(--ease), background .2s}
.arrow svg{width:18px; height:18px}
.arrow:hover{transform:scale(1.07); background:rgba(235,238,233,.88)}
.arrow:active{transform:scale(.95)}
.arrow[disabled]{opacity:.28; pointer-events:none}
.is-home .arrow{opacity:0; pointer-events:none}

/* ───────── dock ───────── */
.dock{
  position:fixed; z-index:30; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translate(-50%,0);
  width:min(940px, calc(100% - 28px)); height:66px; padding:0 10px; display:flex; align-items:center; gap:10px;
  border-radius:22px; background:var(--glass);
  -webkit-backdrop-filter:saturate(170%) blur(26px); backdrop-filter:saturate(170%) blur(26px);
  box-shadow:0 0 0 1px var(--hair), 0 1px 0 rgba(255,255,255,.5) inset, 0 24px 48px -20px rgba(10,14,10,.45);
  transition:transform .7s var(--ease), opacity .45s;
}
body:not(.reading) .dock{transform:translate(-50%,130%); opacity:0; pointer-events:none}
.dock-projects{display:flex; align-items:center; gap:9px; height:46px; padding:0 15px 0 12px; border-radius:14px; font-size:13px; font-weight:600; background:var(--ink); color:#f3f4f1; white-space:nowrap;
  transition:transform .3s var(--ease), background .2s}
.dock-projects:hover{background:#000; transform:translateY(-1px)}
.dock-projects svg{width:16px; height:16px}
.dock-meta{display:flex; flex-direction:column; gap:3px; padding:0 8px 0 6px; min-width:0; flex:0 1 auto}
.dock-meta .ch{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dock-meta .pp{font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.film{flex:1 1 0; min-width:0; height:100%; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; padding:0 18px;
  -webkit-mask-image:linear-gradient(to right, transparent, #000 14px, #000 calc(100% - 14px), transparent); mask-image:linear-gradient(to right, transparent, #000 14px, #000 calc(100% - 14px), transparent)}
.film::-webkit-scrollbar{display:none}
.film button{flex:none; height:34px; border-radius:4px; overflow:hidden; opacity:.6; box-shadow:0 0 0 1px rgba(19,20,20,.16); transition:opacity .25s, transform .35s var(--ease), box-shadow .25s; margin:6px 0}
.film button img{display:block; height:100%; width:auto; aspect-ratio:var(--ar); object-fit:cover}
.film button:hover{opacity:1; transform:translateY(-2px)}
.film button.on{opacity:1; transform:scale(1.14); box-shadow:0 0 0 2px var(--blue), 0 8px 16px -8px rgba(43,91,255,.7); margin:6px 5px}
.dock-step{display:flex; gap:2px}
.dock-step .icon{width:40px; height:40px}
.dock-step .icon[disabled]{opacity:.28; pointer-events:none}

/* ───────── projects sheet ───────── */
.sheet{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px 20px;
  background:rgba(172,175,170,.42); -webkit-backdrop-filter:saturate(150%) blur(34px); backdrop-filter:saturate(150%) blur(34px);
  opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility .4s; overflow:auto}
.sheet.open{opacity:1; visibility:visible}
.sheet-inner{display:flex; flex-direction:column; align-items:center; gap:clamp(16px,3.4vh,34px); max-width:100%}
.sheet-head{text-align:center}
.sheet-head h2{margin:0; font-family:var(--cond); font-weight:760; font-stretch:68%; text-transform:uppercase; font-size:clamp(34px,6vh,64px); line-height:.9}
.sheet-head p{margin:10px 0 0; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.sheet .card{opacity:0; transform:translateY(34px) scale(.96)}
.sheet.open .card{opacity:1; transform:none; transition:transform .7s var(--ease), opacity .5s, box-shadow .5s var(--ease); transition-delay:calc(var(--i)*45ms + 60ms)}
.sheet.open .card:hover,.sheet.open .card:focus-visible{transform:translateY(-10px) scale(1.035); transition-delay:0s}
.sheet.open .cards:hover .card:not(:hover){opacity:.7}
.sheet-links{display:flex; flex-wrap:wrap; justify-content:center; gap:6px}
.sheet-links button{font-size:13px; padding:9px 16px; min-height:40px; border-radius:980px; background:rgba(19,20,20,.08); transition:background .2s}
.sheet-links button:hover{background:rgba(19,20,20,.14)}
.sheet .close{position:fixed; top:14px; right:clamp(14px,2.6vw,36px); width:40px; height:40px; background:rgba(19,20,20,.08); color:var(--ink)}

/* ───────── small screens ───────── */
@media (max-width:820px){
  .home{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"h1" "book" "h2" "cards"; padding:28px 18px 20px; row-gap:10px}
  .hd.b{margin-top:6px}
  .home-right{overflow-x:auto; scrollbar-width:none; padding:14px 18px 10px; margin:0 -18px}
  .home-right::-webkit-scrollbar{display:none}
  .dock{height:60px; border-radius:18px; gap:6px}
  .dock-meta,.dock-projects span{display:none}
  .dock-projects{padding:0 13px}
  .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important; transition-delay:0s !important}
}
</style>
</head>
<body>

<main id="app" class="is-home">
  <section class="home" id="home" aria-label="Portfolio, Thibault Passini">
    <div class="hd a">
      <h2>If you have time</h2>

        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const pad = (n,l=2) => String(n).padStart(l,'0');
const wait = ms => new Promise(r => setTimeout(r, ms));
const RAD = Math.PI/180;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rootStyle = document.documentElement.style;

/* ── book data ── */
const LAST = 47;              // spreads: 0 cover … 47 back cover
const NP = 2*LAST;            // pages p001 … p094 (p001 is the metal cover, built in code)
const BACK = LAST-1;          // the leaf carrying the back cover
const RATIO = 1500/1600;
const CH = [
  {no:'00', name:'Opening',            from:0,  to:2 },
  {no:'01', name:'Poncelet Boats',     from:3,  to:12, cat:'Transportation design', meta:'Industrial partner · 3 months'},
  {no:'02', name:'Yellow Window — NOX',from:13, to:21, cat:'Space design',          meta:'Internship client · 3 months'},
  {no:'03', name:'L-Acoustics',        from:22, to:33, cat:'Furniture design',      meta:'Industrial partner · 5 months'},
  {no:'04', name:'Cigarette Racing',   from:34, to:38, cat:'Transportation design', meta:'Solo · 1 month'},
  {no:'05', name:'The Kiss of Sound',  from:39, to:42, cat:'Audio design',          meta:'Solo · 36 hours'},
  {no:'06', name:'Zeekr 礼物',          from:43, to:45, cat:'Product design',        meta:'Duo team · 3 days'},
  {no:'07', name:'Annexes',            from:46, to:47}
];
const PROJECTS = CH.slice(1,7);
const folioOf = k => k<=10 ? 2*k : k===11 ? 20 : 2*k-2 + (k>=39 ? 8 : 0);
const folio = k => k===0 ? 'Cover' : k===LAST ? 'Back cover' : `p. ${pad(folioOf(k))}–${pad(folioOf(k)+1)}`;
const chapterOf = k => CH.find(c => k>=c.from && k<=c.to);
const pageURL = n => `pages/p${pad(n,3)}.webp`;
const midURL  = k => `mid/m${pad(k)}.webp`;
const fullTex = n => ({url:pageURL(n), half:null});
const midTex  = n => n===NP ? {url:midURL(LAST),half:null} : {url:midURL(n>>1), half:n%2===0?'L':'R'};
const leftPage  = k => k>=1 ? 2*k : null;
const rightPage = k => k<=LAST-1 ? 2*k+1 : null;

/* ── elements ── */
const app=$('#app'), stage=$('#stage'), rig=$('#rig'), book=$('#book'), solid=$('#solid'), leavesEl=$('#leaves');
const pgL=$('#pgL'), pgR=$('#pgR'), slot=$('#slot'), floor=$('#floor');
const prevB=$('#prev'), nextB=$('#next'), film=$('#film'), sheet=$('#sheet'), live=$('#live');

/* ── the brushed-steel cover, with engraved type ── */
function makeCover(){
  const m = document.createElement('div'); m.className='metal';
  m.innerHTML =
    '<i class="sp1"></i><i class="sp2"></i><i class="sp3"></i>' +
    '<div class="lt arc">ARCHIVE 2026</div>' +
    '<div class="lt cat"><span class="c1">PRODUCT</span><b class="p1"></b><span class="c2">TRANSPORTATION</span><b class="p2"></b><span class="c3">SPACE</span></div>' +
    '<div class="red"><div class="ttl"><span class="blk"><span>SELECTED</span><span class="wrk"><span>W</span><span>O</span><span>R</span><span>K</span><span>.</span></span></span></div>' +
    '<div class="nm">THIBAULT PASSINI</div></div>';
  return m;
}

/* ── image cache ── */
const imgs = new Map();
function img(n){
  let im = imgs.get(n);
  if(!im){ im = new Image(); im.decoding='async'; im.alt=''; im.draggable=false; im.src=pageURL(n); imgs.set(n,im); }
  return im;
}
function ready(n){
  if(n==null || n<2 || n>NP) return Promise.resolve();
  const im = img(n);
  return (im.decode ? im.decode() : Promise.resolve()).catch(()=>{});
}

/* ── geometry ── */
let PW=400, PH=427, O=6, TB=5, TH=34, rigLeft=0, rigTop=0;
let home = {x:0,y:0,s:1};
const BASE = {rx:-13, ry:31};
let cur = {...BASE}, tgt = {...BASE};
let mode = 'home';
let pos = 0;
const tf = (x,y,s,rx,ry) => `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) scale(${s.toFixed(4)}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
const shiftX = k => k===0 ? -(PW+O)/2 : k===LAST ? (PW+O)/2 : 0;

function layout(){
  settleAll();
  const narrow = innerWidth < 820;
  const vw = innerWidth, vh = innerHeight;
  const barH = 44, dockSpace = narrow ? 84 : 98;
  const availW = vw - (narrow ? 20 : 172);
  const availH = vh - barH - dockSpace - (narrow ? 22 : 40);
  PW = Math.max(110, Math.floor(Math.min(availW/2, availH*RATIO)));
  PH = Math.round(PW/RATIO);
  O  = Math.max(3, Math.round(PW*0.014));
  TB = Math.max(3, PW*0.017);
  TH = PW*0.135;
  rootStyle.setProperty('--pw', PW+'px'); rootStyle.setProperty('--ph', PH+'px'); rootStyle.setProperty('--o', O+'px'); rootStyle.setProperty('--persp', (PW*5)+'px');
  rigLeft = vw/2 - PW; rigTop = barH + (vh - barH - dockSpace)/2 - PH/2 + 4;
  rig.style.left = rigLeft+'px'; rig.style.top = rigTop+'px';
  const W = PW+O;
  rig.style.transformOrigin = `${PW+W/2}px ${PH/2}px ${-TH/2}px`;
  prevB.style.left = Math.max(8, rigLeft-70)+'px'; nextB.style.left = Math.min(vw-56, rigLeft+2*PW+22)+'px';
  prevB.style.top = nextB.style.top = (rigTop+PH/2)+'px';
  const sl = slot.getBoundingClientRect();
  const s = Math.min(sl.width*0.78/W, sl.height*0.84/(PH+2*O), 1.3);
  home = { s, x:(sl.left+sl.width/2) - (rigLeft+PW+W/2), y:(sl.top+sl.height/2) - (rigTop+PH/2) - sl.height*0.02 };
  const fw = W*s*1.12, fh = Math.max(26, PH*s*0.11);
  floor.style.width = fw+'px'; floor.style.height = fh+'px';
  floor.style.transform = `translate(${(sl.left+sl.width/2-fw/2+W*s*0.03).toFixed(1)}px,${(sl.top+sl.height/2+PH*s*0.52).toFixed(1)}px)`;
  buildSolid();
  fitCards($('#homeCards'), $('#homeRight'), narrow);
  if(sheetOpen) fitSheet();
  if(mode==='home'){ rig.style.transition='none'; rig.style.transform = tf(home.x,home.y,home.s,cur.rx,cur.ry); }
  else if(mode==='reader'){ rig.style.transition='none'; rig.style.transform = tf(shiftX(pos),0,1,0,0); }
  renderStatic();
}

/* ── closed 3D book ── */
function buildSolid(){
  const W=PW+O, H=PH+2*O, T=TH, Tb=TB;
  solid.style.left=PW+'px'; solid.style.top=(-O)+'px'; solid.style.width=W+'px'; solid.style.height=H+'px';
  solid.textContent='';
  const face=(parent,cls,w,h,t)=>{const d=document.createElement('div'); d.className='face '+cls; d.style.width=w+'px'; d.style.height=h+'px'; d.style.transform=t; parent.appendChild(d); return d;};
  face(solid,'mt top',  W, Tb, `translate3d(0,0,${-T}px) rotateX(90deg)`);
  face(solid,'mt right',Tb, H, `translate3d(${W}px,0,${-T+Tb}px) rotateY(90deg)`);
  const sp = face(solid,'spine', T-Tb, H, `translate3d(0,0,${-T}px) rotateY(-90deg)`);
  sp.innerHTML = '<span>Thibault Passini — Selected work</span>';
  sp.firstChild.style.fontSize = Math.max(6, T*0.2)+'px';
  face(solid,'mt top', Tb, T-2*Tb, `translate3d(0,0,${-T+Tb}px) rotateX(90deg)`);
  const bx=Tb, by=O, bw=PW-Tb, bh=PH;
  face(solid,'edge top',   bw, T-2*Tb, `translate3d(${bx}px,${by}px,${-T+Tb}px) rotateX(90deg)`);
  face(solid,'edge right', T-2*Tb, bh, `translate3d(${bx+bw}px,${by}px,${-Tb}px) rotateY(90deg)`);
  face(solid,'blockfront', bw, bh, `translate3d(${bx}px,${by}px,${-Tb}px)`).style.backgroundImage = `url("${pageURL(3)}")`;
  const lid=document.createElement('div'); lid.className='lid'; lid.style.width=W+'px'; lid.style.height=H+'px'; solid.appendChild(lid);
  face(lid,'mt-in',     W, H,  `translate3d(${W}px,0,${-Tb}px) rotateY(180deg)`);
  face(lid,'mt top',    W, Tb, `translate3d(0,0,${-Tb}px) rotateX(90deg)`);
  face(lid,'mt right',  Tb, H, `translate3d(${W}px,0,0) rotateY(90deg)`);
  face(lid,'lidleft',   Tb, H, `translate3d(0,0,${-Tb}px) rotateY(-90deg)`);
  face(lid,'coverface', W, H,  `translate3d(0,0,0)`).appendChild(makeCover());
}

/* ── static pages ── */
function setStatic(side, n){
  const el = side==='L' ? pgL : pgR;
  if(n==null){ el.hidden=true; el.dataset.n=''; el.textContent=''; el.classList.remove('cover','mcover'); return; }
  el.hidden=false;
  if(el.dataset.n !== String(n)){ el.replaceChildren(n===1 ? makeCover() : img(n)); el.dataset.n=String(n); }
  el.classList.toggle('cover', n===1 || n===NP);
  el.classList.toggle('mcover', n===1);
}
function renderStatic(){
  setStatic('L', leftPage(pos)); setStatic('R', rightPage(pos));
  book.classList.toggle('has-left', pos>=1); book.classList.toggle('has-right', pos<=LAST-1);
}

/* ── leaves (soft pages bend in vertical strips) ── */
const NSTRIP = 8;
function paint(el, t, off, w, h){
  el.style.backgroundImage = `url("${t.url}")`;
  el.style.backgroundSize = `${t.half ? 2*w : w}px ${h}px`;
  el.style.backgroundPosition = `${-(off + (t.half==='R' ? w : 0))}px 0`;
}
function makeLeaf(p, frontFull, backFull){
  const hard = p===0 || p===BACK;
  const front = 2*p+1, back = 2*p+2;
  const el = document.createElement('div'); el.className = 'leaf'+(hard?' hard':'');
  const cast = document.createElement('div'); cast.className='cast'; el.appendChild(cast);
  const n = hard ? 1 : NSTRIP, w = hard ? PW+O : PW, sw = w/n, strips=[];
  for(let k=0;k<n;k++){
    const s=document.createElement('div'); s.className='strip';
    const lap = k<n-1 ? .8 : 0;
    s.style.width=(sw+lap)+'px';
    const f=document.createElement('div'); f.className='f';
    const b=document.createElement('div'); b.className='b';
    const sd=document.createElement('div'); sd.className='sd';
    if(hard){
      const ins=document.createElement('div'); ins.className='inset';
      if(p===0){ f.appendChild(makeCover()); ins.style.left=O+'px'; ins.style.backgroundImage=`url("${pageURL(2)}")`; b.appendChild(ins); }
      else     { b.style.background=`var(--paper) url("${pageURL(NP)}") 0 0/100% 100%`; ins.style.left='0px'; ins.style.backgroundImage=`url("${pageURL(NP-1)}")`; f.appendChild(ins); }
      s.append(f,b,sd);
    } else {
      paint(f, frontFull ? fullTex(front) : midTex(front), k*sw, PW, PH);
      paint(b, backFull  ? fullTex(back)  : midTex(back), (n-1-k)*sw - lap, PW, PH);
      const pp=document.createElement('div'); pp.className='pp'; pp.style.backgroundPosition=`${-k*sw}px 0`;
      s.append(f,b,pp,sd);
      if(k===0){ const cr=document.createElement('div'); cr.className='cr'; s.appendChild(cr); }
    }
    el.appendChild(s); strips.push({s,sd,back:false});
  }
  let thick=null;
  if(hard){ thick=document.createElement('div'); thick.className='thick'; thick.style.width=(TB*1.5)+'px'; thick.style.left=(-TB*0.75)+'px'; el.appendChild(thick); }
  function set(theta, delta, castK){
    let X=0, Z=0;
    for(let k=0;k<n;k++){
      const c = clamp(theta + k*delta, 0, 180), r = c*RAD, st = strips[k];
      st.s.style.transform = `translate3d(${X.toFixed(2)}px,0,${Z.toFixed(2)}px) rotateY(${(-c).toFixed(3)}deg)`;
      const bk = c>90;
      if(bk!==st.back){ st.back=bk; st.s.classList.toggle('back', bk); }
      st.sd.style.opacity = (0.3*Math.sin(r)*(bk?.8:1)).toFixed(3);
      X += sw*Math.cos(r); Z += sw*Math.sin(r);
    }
    const t = theta*RAD, proj = Math.cos(t);
    const reach = proj + (proj>=0?1:-1)*0.07*Math.sin(t);
    cast.style.transform = `scaleX(${reach.toFixed(4)})`;
    cast.style.opacity = (castK*Math.sin(t)).toFixed(3);
    if(thick){
      thick.style.transform = `translate3d(${(w*Math.cos(t)).toFixed(2)}px,0,${(w*Math.sin(t)).toFixed(2)}px) rotateY(${(-(theta+90)).toFixed(2)}deg)`;
      if(p===0) el.style.setProperty('--tilt', (-theta*0.75).toFixed(1));
    }
  }
  return {el, set, p, hard};
}

/* ── soft page: the sheet folds along the line that bisects its corner and the pointer ── */
function clipPoly(pts, M, n, keepPos){
  const out=[], side=q=>((q.x-M.x)*n.x+(q.y-M.y)*n.y)*(keepPos?1:-1);
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length], sa=side(a), sb=side(b);
    if(sa>=0) out.push(a);
    if((sa>=0)!==(sb>=0)){ const t=sa/(sa-sb); out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
  }
  return out;
}

/* ── animation engine ── */

    const from = fwd?0:180, toA = fwd?180:0;

async function go(target){

  target = clamp(Math.round(target), 0, LAST);
  if(prepping){ pending = target; return; }
  if(target===pos) return;
  const d = target>pos ? 1 : -1;

/* ── open / close ── */

  ready(2); ready(3); ready(leftPage(target)); ready(rightPage(target));
  app.classList.remove('is-home'); app.classList.add('is-reading'); document.body.classList.add('reading');
  rig.style.transition = reduced ? 'none' : 'transform 950ms cubic-bezier(.3,.7,.1,1)';

/* ── light on the steel: follows the pointer (or the phone's tilt), with a slow drift ── */
let lx=.5, ly=.4, tlx=.62, tly=.35;
addEventListener('pointermove', e => {

/* ── cards ── */
function cardsInto(el, onPick){
  PROJECTS.forEach((c,i) => {
    const b=document.createElement('button'); b.className='card'; b.dataset.k=c.from; b.style.setProperty('--i', i);
    b.setAttribute('aria-label', `${c.no} ${c.name}, ${c.cat}. Jump to ${folio(c.from).replace('p. ','page ').replace(/–.*/,'')}`);
    const im=new Image(); im.alt=''; im.src=`cards/c${i+1}.webp`; im.width=720; im.height=1264; b.appendChild(im);
    b.addEventListener('click', () => onPick(c));
    el.appendChild(b);
  });
}
function fitCards(el, box, scroll){
  const r = box.getBoundingClientRect(), A = 1484/845;
  if(scroll){ const cw = clamp(Math.floor((innerHeight*0.22)/A), 80, 140); el.style.setProperty('--cols',6); el.style.setProperty('--gap','10px'); el.style.setProperty('--cw', cw+'px'); return; }
  let best={cw:0};
  for(const cols of [6,3,2]){
    const rows = 6/cols, g = 16;
    const cw = Math.min((r.width-(cols-1)*g)/cols, ((r.height-(rows-1)*g)/rows)/A);
    if(cw>best.cw) best={cw,cols,g};
  }
  el.style.setProperty('--cols', best.cols); el.style.setProperty('--gap', best.g+'px'); el.style.setProperty('--cw', Math.floor(clamp(best.cw,70,250))+'px');
}
function fitSheet(){
  const el = $('#sheetCards'), A = 1484/845, vw = innerWidth-40, vh = innerHeight;
  const headroom = vh < 620 ? 190 : 250;
  let best={cw:0};
  for(const cols of [6,3,2]){
    const rows = 6/cols, g = cols===6 ? 18 : 14;
    const cw = Math.min((vw-(cols-1)*g)/cols, ((vh-headroom-(rows-1)*g)/rows)/A, 250);
    if(cw>best.cw) best={cw,cols,g};
  }
  el.style.setProperty('--cols', best.cols); el.style.setProperty('--gap', best.g+'px'); el.style.setProperty('--cw', Math.floor(Math.max(best.cw,84))+'px');
}
const ifnot = $('#ifnot'), ifnotRest = ifnot.textContent;
cardsInto($('#homeCards'), c => openBook(c.from));
cardsInto($('#sheetCards'), c => { closeSheet(); go(c.from); });
$('#homeCards').querySelectorAll('.card').forEach((b,i) => {
  const c = PROJECTS[i], txt = `${c.no} · ${c.cat} · ${c.meta}`;
  const on = () => ifnot.textContent = txt, off = () => ifnot.textContent = ifnotRest;
  b.addEventListener('pointerenter', on); b.addEventListener('focus', on);
  b.addEventListener('pointerleave', off); b.addEventListener('blur', off);
});

/* ── projects sheet ── */
let sheetOpen=false, sheetReturn=null;
function openSheet(){
  if(sheetOpen) return;
  if(grab && !grab.dragging) dropGrab();
  sheetOpen=true; sheetReturn=document.activeElement;
  fitSheet();
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  const t = sheet.querySelector('.card.current') || sheet.querySelector('.card');
  setTimeout(() => t && t.focus({preventScroll:true}), 60);
}
function closeSheet(){
  if(!sheetOpen) return;
  sheetOpen=false; sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true');
  if(sheetReturn && sheetReturn.focus) sheetReturn.focus({preventScroll:true});
}
sheet.addEventListener('click', e => { if(e.target===sheet || e.target.classList.contains('sheet-inner')) closeSheet(); });
$('#sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('keydown', e => {
  if(e.key!=='Tab') return;
  const f=[...sheet.querySelectorAll('button')]; const a=f[0], z=f[f.length-1];
  if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
});

/* ── controls ── */
function nav(v){
  if(v==='projects'){ openSheet(); return; }
  const k = +v; closeSheet();
  if(mode==='home') openBook(k===0 ? 1 : k); else go(k);
}
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => nav(b.dataset.nav)));
$('#openBtn').addEventListener('click', () => openBook(1));
solid.addEventListener('click', () => openBook(1));
solid.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openBook(1); } });
$('#closeBook').addEventListener('click', closeBook);
$('#dockProjects').addEventListener('click', openSheet);
prevB.addEventListener('click', () => go(pos-1));
nextB.addEventListener('click', () => go(pos+1));
book.querySelector('.hit.prev').addEventListener('click', () => {
  if(swiped) return;
  if(grab && !grab.dragging && !grab.fwd) releaseGrab(true); else go(pos-1);
});
book.querySelector('.hit.next').addEventListener('click', () => {
  if(swiped) return;
  if(grab && !grab.dragging && grab.fwd) releaseGrab(true); else go(pos+1);
});
function chapterStep(d){
  const i = CH.indexOf(chapterOf(pos));
  if(d<0) go(pos>CH[i].from ? CH[i].from : CH[Math.max(0,i-1)].from);
  else if(i<CH.length-1) go(CH[i+1].from);
}
$('#chPrev').addEventListener('click', () => chapterStep(-1));
$('#chNext').addEventListener('click', () => chapterStep(1));

addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='Escape'){ if(sheetOpen) closeSheet(); else if(mode==='reader') closeBook(); return; }
  if(sheetOpen) return;
  const k = e.key;
  if(mode==='home'){ if(k==='ArrowRight'){ e.preventDefault(); openBook(1); } return; }
  if(mode!=='reader' || (grab && grab.dragging)) return;
  if(k==='ArrowRight' || k==='PageDown' || (k===' ' && !e.shiftKey && e.target===document.body)){ e.preventDefault(); go(pos+1); }
  else if(k==='ArrowLeft' || k==='PageUp' || (k===' ' && e.shiftKey && e.target===document.body)){ e.preventDefault(); go(pos-1); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(LAST); }
  else if(k==='p' || k==='P'){ openSheet(); }
  else if(/^[1-6]$/.test(k)){ go(PROJECTS[+k-1].from); }
});
let wAcc=0, wLock=0;
addEventListener('wheel', e => {
  if(mode!=='reader' || sheetOpen || e.ctrlKey || (grab && grab.dragging)) return;
  if(e.target.closest && e.target.closest('.film')) return;
  const now=performance.now(); if(now<wLock) return;
  wAcc += Math.abs(e.deltaX)>Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(Math.abs(wAcc)>70){ go(pos + (wAcc>0?1:-1)); wAcc=0; wLock=now+700; }
}, {passive:true});


/* ── full screen ── */
const fsB=$('#fs');
if(!document.fullscreenEnabled) fsB.hidden=true;
fsB.addEventListener('click', () => {
  try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); } }catch(_){}
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('is-fs', on);
  fsB.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
});

/* ── boot ── */
let rz=0;
addEventListener('resize', () => { clearTimeout(rz); rz=setTimeout(layout, 90); });
layout(); onPos();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(homeLoop);
requestAnimationFrame(lightLoop);
addEventListener('load', () => {
  for(let k=1;k<=LAST;k++){ const im=new Image(); im.src=midURL(k); }
  let n=2; const next=()=>{ if(n>NP) return; const im=img(n++); if(im.complete) next(); else { im.addEventListener('load',next,{once:true}); im.addEventListener('error',next,{once:true}); } };
  setTimeout(()=>{ next(); next(); next(); }, 600);
});
})();
</script>
